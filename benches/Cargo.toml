[package]
name = "hft-crypto-bot-benches"
version = "1.0.0"
edition = "2021"
publish = false

[[bench]]
name = "tick_to_trade"
harness = false

[[bench]]
name = "orderbook_update"
harness = false

[dependencies]
# Core benchmarking framework
criterion = { version = "0.5", features = ["html_reports"] }

# Random data generation for benchmarks
rand = "0.8"
rand_chacha = "0.3"

# Async runtime for async benchmarks (if needed)
tokio = { version = "1.35", features = ["full"] }

# Serialization for IPC testing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For atomic operations and lock-free structures
crossbeam = "0.8"
parking_lot = "0.12"

[dev-dependencies]
# Additional testing utilities
proptest = "1.4"

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
debug = false
strip = true

[[test]]
name = "bench_integration"
harness = false
