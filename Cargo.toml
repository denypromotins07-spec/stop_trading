[package]
name = "hft_crypto_bot"
version = "0.1.0"
edition = "2021"
authors = ["HFT Architect"]
description = "Ultra-low-latency crypto trading bot for AMD Ryzen AI 5"

# Nightly features required for custom allocators and TSC access
[features]
default = []
nightly = ["allocator_api"]

[dependencies]
# Async Runtime
tokio = { version = "1", features = ["full", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

# Parallelism & Concurrency
rayon = "1.8"
crossbeam = "0.8"
crossbeam-channel = "0.5"
num_cpus = "1.16"

# System-level access (for CPU pinning on Linux)
libc = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Environment Management
dotenvy = "0.15"

# Logging (structured, async-friendly)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Math & Statistics
ordered-float = "4.2"

# Time handling
chrono = "0.4"

# Hardware topology (optional, fallback to manual implementation if needed)
# Note: We implement custom pinning for maximum control, but hwloc could be added later.

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort" # Abort on panic to prevent unwinding overhead in production
strip = true    # Strip symbols for smaller binary
debug = false

[profile.dev]
opt-level = 1
debug = true
